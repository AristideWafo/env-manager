{% load icons %}
<span id="revealed-{{ key }}" class="inline-flex items-center gap-1.5 font-mono text-accent select-all">
  {% icon "eye" "w-3.5 h-3.5" %} {{ value }}
</span>
<template id="mask-{{ key }}"><span class="badge badge-warning">{% icon "key" "w-3 h-3" %} secret</span></template>
<script>
(function () {
  var span = document.getElementById("revealed-{{ key }}");
  var mask = document.getElementById("mask-{{ key }}");
  if (!span || !mask) return;
  setTimeout(function () {
    var td = span.closest("td");
    if (td && document.body.contains(span)) {
      td.innerHTML = mask.innerHTML;
    }
  }, 10000);
})();
</script>
