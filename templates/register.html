{% extends "layouts/auth.html" %}
{% load icons %}
{% block title %}Register passkey — Env Manager{% endblock %}
{% block content %}
<h1 class="auth-title">Register your passkey</h1>
<p class="auth-subtitle">Paste the invitation link your admin sent you.</p>

<form id="register-form" class="space-y-4">
  <div>
    <label for="token" class="field-label">Invitation token</label>
    <input id="token" type="text" value="{{ token }}" placeholder="eyJ1c2VyIjo..." spellcheck="false" required class="field-input font-mono">
  </div>
  <div>
    <label for="label" class="field-label">Device label</label>
    <input id="label" type="text" placeholder="e.g. Work laptop" autocomplete="off" required class="field-input">
  </div>
  <button id="register-btn" type="submit" class="btn btn-primary w-full">
    {% icon "key" "w-4 h-4" %} Register device
  </button>
  <div id="msg" aria-live="polite"></div>
</form>
{% endblock %}
{% block extra_script %}
<script>
  document.getElementById("register-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const token = document.getElementById("token").value.trim();
    const label = document.getElementById("label").value.trim();
    const msg = document.getElementById("msg");
    msg.replaceChildren();
    try {
      await registerPasskey(token, label);
      showAlert(msg, "success", "Passkey registered — you can now log in.");
    } catch (e) {
      showAlert(msg, "error", e.message || "Registration failed");
    }
  });
</script>
{% endblock %}
