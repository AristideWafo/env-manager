{% extends "layouts/auth.html" %}
{% load icons %}
{% block title %}Register passkey — Env Manager{% endblock %}
{% block content %}
<h1 class="text-lg font-semibold text-center mb-1">Register your passkey</h1>
<p class="text-sm text-muted text-center mb-6">Paste the invitation link your admin sent you.</p>

<div class="space-y-4">
  <div>
    <label for="token" class="field-label">Invitation token</label>
    <input id="token" type="text" value="{{ token }}" placeholder="eyJ1c2VyIjo..." class="field-input font-mono">
  </div>
  <div>
    <label for="label" class="field-label">Device label</label>
    <input id="label" type="text" placeholder="e.g. Work laptop" class="field-input">
  </div>
  <button id="register-btn" type="button" class="btn btn-primary w-full">
    {% icon "key" "w-4 h-4" %} Register device
  </button>
  <div id="msg"></div>
</div>
{% endblock %}
{% block extra_script %}
<script>
  document.getElementById("register-btn").addEventListener("click", async () => {
    const token = document.getElementById("token").value.trim();
    const label = document.getElementById("label").value.trim();
    const msg = document.getElementById("msg");
    try {
      await registerPasskey(token, label);
      msg.innerHTML = `<div class="alert alert-success">Passkey registered — you can now log in.</div>`;
    } catch (e) {
      msg.innerHTML = `<div class="alert alert-error">${e.message || "registration failed"}</div>`;
    }
  });
</script>
{% endblock %}
