{% load static %}<c-vars title="Env Manager" />
{% comment %}Centered auth-card shell for login/register — no sidebar.{% endcomment %}
<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>window.__SCRIPT_PREFIX__ = "{{ request.META.SCRIPT_NAME }}";</script>
  <script src="{% static 'js/webauthn.js' %}" defer></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12 relative overflow-hidden">
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top,_theme(colors.indigo.900/40),_transparent_60%)]"></div>
    <div class="relative w-full max-w-sm">
      <div class="flex flex-col items-center gap-2 mb-6">
        <div class="rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 p-2.5 shadow-lg shadow-indigo-950/50">
          <c-icon.shield class="w-6 h-6 text-white" />
        </div>
        <span class="font-semibold tracking-tight text-lg">Env Manager</span>
      </div>
      <div class="rounded-2xl border border-slate-800 bg-slate-900/70 backdrop-blur-sm shadow-2xl shadow-black/40 p-6">
        {{ slot }}
      </div>
    </div>
  </div>
</body>
</html>
