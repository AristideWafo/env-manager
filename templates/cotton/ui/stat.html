<c-vars label="" value="" tone="indigo" />
{% comment %}<c-ui.stat label="Environments" value="4" tone="indigo"><c-icon.folder class="w-5 h-5" /></c-ui.stat>{% endcomment %}
<div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4 flex items-center gap-3">
  <div class="shrink-0 rounded-lg p-2 bg-{{ tone }}-500/10 text-{{ tone }}-300">
    {{ slot }}
  </div>
  <div>
    <div class="text-xs uppercase tracking-wide text-slate-500">{{ label }}</div>
    <div class="text-xl font-semibold text-slate-100">{{ value }}</div>
  </div>
</div>
