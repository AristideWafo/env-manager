<c-vars title="" description="" />
{% comment %}
<c-ui.empty title="No projects yet" description="Ask an admin for access.">
  <c-icon.folder class="w-8 h-8" />
</c-ui.empty>
{% endcomment %}
<div class="flex flex-col items-center justify-center text-center py-12 px-6">
  <div class="rounded-full bg-slate-800/80 p-3 text-slate-500 mb-4">
    {{ slot }}
  </div>
  <p class="font-medium text-slate-300">{{ title }}</p>
  {% if description %}<p class="text-sm text-slate-500 mt-1 max-w-sm">{{ description }}</p>{% endif %}
</div>
