<c-vars title="" subtitle="" class="" />
{% comment %}
<c-ui.card title="..." subtitle="...">
  content
  <c-slot name="actions">optional header-right buttons</c-slot>
</c-ui.card>
{% endcomment %}
<div class="rounded-2xl border border-slate-800 bg-slate-900/60 backdrop-blur-sm shadow-xl shadow-black/20 {{ class }}" {{ attrs }}>
  {% if title or actions %}
  <div class="flex items-start justify-between flex-wrap gap-4 border-b border-slate-800 px-5 py-4">
    <div class="min-w-0">
      {% if title %}<h2 class="font-semibold text-slate-100">{{ title }}</h2>{% endif %}
      {% if subtitle %}<p class="text-sm text-slate-500 mt-0.5">{{ subtitle }}</p>{% endif %}
    </div>
    {% if actions %}<div class="flex items-center gap-2 flex-wrap shrink-0">{{ actions }}</div>{% endif %}
  </div>
  {% endif %}
  <div class="p-5">
    {{ slot }}
  </div>
</div>
