{% extends "layouts/auth.html" %}
{% load icons %}
{% block title %}Sign in — Env Manager{% endblock %}
{% block content %}
<h1 class="text-lg font-semibold text-center mb-1">Sign in</h1>
<p class="text-sm text-muted text-center mb-6">Use the passkey registered to your account.</p>

<div class="space-y-4">
  <div>
    <label for="email" class="field-label">Email</label>
    <input id="email" type="email" placeholder="you@company.com" autocomplete="email" class="field-input">
  </div>
  <button id="login-btn" type="button" class="btn btn-primary w-full">
    {% icon "key" "w-4 h-4" %} Continue with passkey
  </button>
  <div id="msg"></div>
  <p class="text-sm text-muted text-center">No account yet? Ask an admin to invite you.</p>
</div>
{% endblock %}
{% block extra_script %}
<script>
  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    msg.innerHTML = "";
    try {
      await loginWithPasskey(email);
      window.location.href = "{% url 'core:dashboard' %}";
    } catch (e) {
      msg.innerHTML = `<div class="alert alert-error">${e.message || "login failed"}</div>`;
    }
  });
</script>
{% endblock %}
