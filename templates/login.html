{% extends "base.html" %}
{% block title %}Login — Env Manager{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 space-y-4">
  <h1 class="text-xl font-semibold">Sign in with your passkey</h1>
  <input id="email" type="email" placeholder="you@company.com"
         class="w-full rounded bg-slate-900 border border-slate-700 px-3 py-2">
  <button id="login-btn" class="w-full rounded bg-indigo-600 hover:bg-indigo-500 px-3 py-2 font-medium">
    Continue
  </button>
  <p id="msg" class="text-sm text-red-400"></p>
  <p class="text-sm text-slate-500">No account yet? Ask an admin to invite you.</p>
</div>
<script>
  document.getElementById("login-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    msg.textContent = "";
    try {
      await loginWithPasskey(email);
      window.location.href = "{% url 'core:dashboard' %}";
    } catch (e) {
      msg.textContent = e.message || "login failed";
    }
  });
</script>
{% endblock %}
