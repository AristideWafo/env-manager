{% extends "layouts/auth.html" %}
{% load icons %}
{% block title %}Sign in — Env Manager{% endblock %}
{% block content %}
<h1 class="auth-title">Sign in</h1>
<p class="auth-subtitle">Use the passkey registered to your account.</p>

<form id="login-form" class="space-y-4">
  <div>
    <label for="email" class="field-label">Email</label>
    <input id="email" type="email" placeholder="you@company.com" autocomplete="email" spellcheck="false" required class="field-input">
  </div>
  <button id="login-btn" type="submit" class="btn btn-primary w-full">
    {% icon "key" "w-4 h-4" %} Continue with passkey
  </button>
  <div id="msg" aria-live="polite"></div>
  <p class="auth-footnote">No account yet? Ask an admin to invite you.</p>
</form>
{% endblock %}
{% block extra_script %}
<script>
  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("msg");
    msg.replaceChildren();
    try {
      await loginWithPasskey(email);
      window.location.href = "{% url 'core:dashboard' %}";
    } catch (e) {
      showAlert(msg, "error", e.message || "Login failed");
    }
  });
</script>
{% endblock %}
