{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Env Manager{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/webauthn.js' %}" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <nav class="border-b border-slate-800 px-6 py-3 flex justify-between items-center">
    <a href="{% url 'core:dashboard' %}" class="font-semibold">Env Manager</a>
    {% if user.is_authenticated %}
      <div class="flex items-center gap-4 text-sm text-slate-400">
        <span>{{ user.email }} · {{ user.role }}</span>
        {% if user.is_admin %}<a href="/admin/" class="hover:text-white">Admin</a>{% endif %}
        <a href="{% url 'core:logout' %}" class="hover:text-white">Logout</a>
      </div>
    {% endif %}
  </nav>
  <main class="max-w-5xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
