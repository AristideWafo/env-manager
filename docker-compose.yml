name: env-manager

services:
  web:
    build: .
    image: ${ENV_MANAGER_IMAGE:-env-manager:latest}
    hostname: env-manager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - env-manager
      - app_network
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a real secret key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      ENV_MANAGER_FERNET_KEY: ${ENV_MANAGER_FERNET_KEY:-}
      ENV_MANAGER_DB_PATH: /app/data/db.sqlite3
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set the hostname passkeys will be registered against}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Env Manager}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?set the https origin serving this app}
      CI_API_TOKENS: ${CI_API_TOKENS:-}
    volumes:
      - db-data:/app/data
      # Mount the project root(s) this instance is allowed to write .env files
      # into (must match the AllowedRoot rows declared by an admin). Point
      # PROJECTS_ROOT at any host path; the container-side mount point is
      # arbitrary as long as it matches the AllowedRoot paths you configure.
      - ${PROJECTS_ROOT:-./data/projects}:${PROJECTS_ROOT_CONTAINER:-/data/projects}
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client,sys; c=http.client.HTTPConnection('localhost',8000,timeout=3); c.request('GET','/login/'); sys.exit(0 if c.getresponse().status < 500 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=app_network"
      - "traefik.http.routers.env-manager.rule=Host(`tools.ffaero.com`) && PathPrefix(`/env-management`)"
      - "traefik.http.routers.env-manager.entrypoints=websecure"
      - "traefik.http.routers.env-manager.tls=true"
      - "traefik.http.routers.env-manager.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.env-manager-strip.stripprefix.prefixes=/env-management"
      - "traefik.http.routers.env-manager.middlewares=env-manager-strip@docker"
      - "traefik.http.services.env-manager.loadbalancer.server.port=8000"

networks:
  env-manager:
    driver: bridge

volumes:
  db-data:
