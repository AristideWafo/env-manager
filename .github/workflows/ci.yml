name: CI

on:
  push:
    branches: [prod, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      ENV_MANAGER_FERNET_KEY: "Cw6yv1uP1i7GfE7dOEXaeYnLTr2C6VqcQha8y_5B1zA="
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: pytest -q

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.name }}:latest

  auto-tag:
    # Computes the next semver tag + a conventional-commit changelog since
    # the last tag, prepends it to CHANGELOG.md, commits that, and tags the
    # resulting commit. Pushing a `v*.*.*` tag triggers release.yml (via a
    # workflow_run watch, since GITHUB_TOKEN-authored pushes don't fire
    # normal push events), which builds the versioned image and publishes
    # the GitHub Release using the same changelog text.
    needs: build-and-push
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version and changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: prod
          dry_run: true

      - name: Update CHANGELOG.md
        if: steps.tag_version.outputs.new_tag
        env:
          TAG: ${{ steps.tag_version.outputs.new_tag }}
          CHANGELOG_BODY: ${{ steps.tag_version.outputs.changelog }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import pathlib

          path = pathlib.Path("CHANGELOG.md")
          marker = "<!-- entries below are prepended automatically, newest first -->"
          header = (
              "# Changelog\n\n"
              "All notable changes to this project are documented here. Entries are\n"
              "generated automatically from conventional commits by the release pipeline.\n\n"
              f"{marker}\n"
          )
          text = path.read_text() if path.exists() else header
          if marker not in text:
              text = header + text

          tag = os.environ["TAG"]
          body = os.environ.get("CHANGELOG_BODY", "").strip() or "_No notable changes._"
          date = datetime.date.today().isoformat()
          entry = f"\n## {tag} - {date}\n\n{body}\n"
          text = text.replace(marker, marker + entry, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): ${TAG} [skip ci]"
          git push origin HEAD:prod

      - name: Tag release commit
        if: steps.tag_version.outputs.new_tag
        env:
          TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
