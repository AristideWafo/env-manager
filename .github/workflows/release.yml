name: Release

# Triggered two ways:
# 1. `push: tags` - someone pushes a `v*.*.*` tag directly (e.g. from a local
#    machine with a personal token).
# 2. `workflow_run` - the CI workflow's `auto-tag` job pushes a tag using the
#    default GITHUB_TOKEN. GitHub does not let GITHUB_TOKEN-authored pushes
#    trigger other workflows (anti-recursion safeguard), so a plain
#    `push: tags` trigger alone would never fire for auto-created tags.
#    Reacting to CI's completion and resolving the tag ourselves works
#    around that limitation without needing a PAT secret.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  resolve-tag:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'prod')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "No v*.*.* tag found on this commit, nothing to release." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      ENV_MANAGER_FERNET_KEY: "Cw6yv1uP1i7GfE7dOEXaeYnLTr2C6VqcQha8y_5B1zA="
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: pytest -q

  build-and-release:
    needs: [resolve-tag, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Extract changelog section for this tag
        id: notes
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text() if path.exists() else ""
          match = re.search(rf"^## {re.escape(tag)} - .*$\n+(.*?)(?=^## |\Z)", text, re.MULTILINE | re.DOTALL)
          body = match.group(1).strip() if match else ""
          pathlib.Path("RELEASE_NOTES.md").write_text(body or "No changelog entry found.")
          PY

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.name }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

